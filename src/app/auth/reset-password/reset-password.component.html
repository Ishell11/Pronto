<main class="auth-shell">
  <ion-button fill="clear" class="back-button" aria-label="Back" (click)="back.emit()">
    <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
  </ion-button>
  <div class="auth-heading">
    <span class="eyebrow">ACCOUNT RECOVERY</span>
    <h1>Reset password.</h1>
    <p>We'll email you a secure link to reset your password.</p>
  </div>
  <form class="auth-form" (ngSubmit)="submitEmail.emit(email)">
    <label class="field">
      <span class="field-label">Email address</span>
      <span class="field-control"><input name="email" [(ngModel)]="email" type="email" placeholder="you@example.com" autocomplete="email" required><ion-icon name="mail-outline"></ion-icon></span>
    </label>
    <div class="inline-error" role="alert" *ngIf="error">{{ error }}</div>
    <div class="inline-success" role="status" *ngIf="notice">{{ notice }}</div>
    <ion-button type="submit" expand="block" class="gradient-button auth-submit" [disabled]="busy">
      <ion-spinner *ngIf="busy" name="crescent"></ion-spinner>
      <ng-container *ngIf="!busy"><ion-icon slot="start" name="mail-outline"></ion-icon>Send reset link</ng-container>
    </ion-button>
  </form>
  <div class="auth-switch">Remembered your password? <button class="text-link" (click)="backToSignIn.emit()">Sign in</button></div>
</main>
